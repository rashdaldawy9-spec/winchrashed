<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="bgDark2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <radialGradient id="electricGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPattern2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="380" fill="url(#bgDark2)"/>
  <rect width="600" height="380" fill="url(#gridPattern2)"/>

  <!-- Road surface -->
  <path d="M0 300 L600 300 L600 380 L0 380 Z" fill="#1e2633"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="#f59e0b" stroke-width="3" stroke-dasharray="16 12"/>

  <!-- Safety Warning Cone 1 -->
  <g transform="translate(60, 240)">
    <polygon points="25,0 12,55 38,55" fill="#f97316"/>
    <polygon points="20,18 16,32 34,32 30,18" fill="#ffffff"/>
    <rect x="5" y="55" width="40" height="8" rx="2" fill="#ea580c"/>
  </g>

  <!-- Safety Warning Cone 2 -->
  <g transform="translate(120, 255)">
    <polygon points="20,0 10,42 30,42" fill="#f97316"/>
    <polygon points="16,14 13,25 27,25 24,14" fill="#ffffff"/>
    <rect x="5" y="42" width="30" height="6" rx="2" fill="#ea580c"/>
  </g>

  <!-- Center Graphic: Car Wheel + Battery + Jumper Cables -->
  <g transform="translate(240, 100)">
    <!-- Electric spark glow -->
    <circle cx="150" cy="80" r="100" fill="url(#electricGlow)"/>

    <!-- Car Tire with alloy rim & hydraulic jack underneath -->
    <g transform="translate(100, 60)">
      <!-- Hydraulic Floor Jack -->
      <polygon points="-20,135 70,135 60,115 -10,115" fill="#ef4444"/>
      <rect x="20" y="85" width="16" height="35" fill="#94a3b8"/>
      <!-- Outer Tire -->
      <circle cx="30" cy="50" r="65" fill="#1e293b" stroke="#0f172a" stroke-width="12"/>
      <!-- Tire treads -->
      <circle cx="30" cy="50" r="60" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 6"/>
      <!-- Rim -->
      <circle cx="30" cy="50" r="42" fill="#334155" stroke="#94a3b8" stroke-width="3"/>
      <!-- Rim spokes -->
      <circle cx="30" cy="50" r="15" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
      <line x1="30" y1="8" x2="30" y2="35" stroke="#94a3b8" stroke-width="4"/>
      <line x1="30" y1="65" x2="30" y2="92" stroke="#94a3b8" stroke-width="4"/>
      <line x1="-12" y1="50" x2="15" y2="50" stroke="#94a3b8" stroke-width="4"/>
      <line x1="45" y1="50" x2="72" y2="50" stroke="#94a3b8" stroke-width="4"/>
      <!-- Lug nuts -->
      <circle cx="22" cy="42" r="3" fill="#f8fafc"/>
      <circle cx="38" cy="42" r="3" fill="#f8fafc"/>
      <circle cx="22" cy="58" r="3" fill="#f8fafc"/>
      <circle cx="38" cy="58" r="3" fill="#f8fafc"/>
    </g>

    <!-- Heavy Duty Car Battery Unit -->
    <g transform="translate(-50, 80)">
      <!-- Battery box -->
      <rect x="0" y="20" width="110" height="95" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <!-- Terminals -->
      <rect x="18" y="10" width="16" height="10" rx="2" fill="#ef4444"/>
      <text x="26" y="22" font-family="sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">+</text>
      
      <rect x="76" y="10" width="16" height="10" rx="2" fill="#3b82f6"/>
      <text x="84" y="21" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">-</text>

      <!-- Battery Brand Plate -->
      <rect x="12" y="38" width="86" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <path d="M55 45 L48 60 L54 60 L50 72 L62 57 L56 57 Z" fill="#fbbf24"/>
      <text x="55" y="98" font-family="'Cairo', sans-serif" font-weight="700" font-size="10" fill="#94a3b8" text-anchor="middle">12V EMERGENCY</text>

      <!-- Heavy Jumper Cable Red clamped -->
      <path d="M26 10 C 26 -20, 110 -20, 140 25" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
      <!-- Heavy Jumper Cable Black clamped -->
      <path d="M84 10 C 84 -10, 140 -5, 155 35" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
      
      <!-- Electric Sparks -->
      <polygon points="140,25 146,16 144,22 152,18 145,30 148,24" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Industrial text overlay badge -->
  <rect x="30" y="24" width="280" height="38" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="170" y="48" font-family="'Cairo', system-ui, sans-serif" font-weight="800" font-size="16" fill="#f8fafc" text-anchor="middle">
    اشتراك بطارية وتغيير إطارات على الطريق
  </text>
</svg>
