<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" fill="none" role="img" aria-label="شعار ونش راشد لإنقاذ وسحب السيارات" direction="rtl">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Industrial Shield Emblem on the Right (Natural Arabic RTL) -->
  <g transform="translate(230, 5)">
    <rect x="0" y="0" width="80" height="80" rx="14" fill="url(#charcoalGrad)" stroke="#f59e0b" stroke-width="2.5"/>
    <path d="M6 68 L16 78 H28 L14 64 H6 Z" fill="#f59e0b" opacity="0.9"/>
    <path d="M32 64 L20 78 H32 L44 64 H32 Z" fill="#f59e0b" opacity="0.9"/>
    <path d="M48 64 L36 78 H48 L60 64 H48 Z" fill="#f59e0b" opacity="0.9"/>
    <path d="M64 64 L52 78 H64 L74 64 H64 Z" fill="#f59e0b" opacity="0.9"/>
    <!-- Truck -->
    <path d="M18 52 L18 36 L30 36 L38 44 L44 44 L44 52 Z" fill="#f8fafc"/>
    <path d="M22 40 L28 40 L34 46 L22 46 Z" fill="#0f172a"/>
    <polygon points="36,46 66,34 68,38 38,50" fill="url(#amberGrad)"/>
    <line x1="34" y1="36" x2="58" y2="28" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="58" cy="28" r="2" fill="#f8fafc"/>
    <circle cx="26" cy="54" r="6.5" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="26" cy="54" r="2.5" fill="#f8fafc"/>
    <circle cx="54" cy="54" r="6.5" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="54" cy="54" r="2.5" fill="#f8fafc"/>
    <polygon points="26,32 30,32 29,36 24,36" fill="#f59e0b"/>
  </g>

  <!-- Typography to the LEFT of the emblem (x=215, right-aligned) -->
  <text x="215" y="46" font-family="'Cairo', system-ui, sans-serif" font-weight="900" font-size="34" fill="#0f172a" text-anchor="end">
    ونش <tspan fill="#d97706">راشد</tspan>
  </text>
  <text x="215" y="68" font-family="'Cairo', system-ui, sans-serif" font-weight="700" font-size="12" fill="#475569" text-anchor="end">
    لإنقاذ وسحب السيارات • 24 ساعة
  </text>
</svg>