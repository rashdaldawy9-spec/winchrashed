<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none" role="img" aria-label="شعار ونش راشد لإنقاذ وسحب السيارات">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Industrial Emblem / Shield -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="14" fill="url(#charcoalGrad)" stroke="#f59e0b" stroke-width="2.5"/>
    
    <!-- Hazard Warning Stripe Accent at bottom of emblem -->
    <path d="M6 86 L18 98 H32 L16 82 H6 Z" fill="#f59e0b" opacity="0.9"/>
    <path d="M38 82 L22 98 H36 L52 82 H38 Z" fill="#f59e0b" opacity="0.9"/>
    <path d="M58 82 L42 98 H56 L72 82 H58 Z" fill="#f59e0b" opacity="0.9"/>
    <path d="M78 82 L62 98 H76 L92 82 H78 Z" fill="#f59e0b" opacity="0.9"/>

    <!-- Flatbed Tow Truck Stylized Silhouette -->
    <!-- Cabin -->
    <path d="M22 66 L22 46 L38 46 L48 54 L54 54 L54 66 Z" fill="#f8fafc"/>
    <path d="M28 50 L36 50 L44 56 L28 56 Z" fill="#0f172a"/>
    <!-- Flatbed Bed tilted -->
    <polygon points="46,58 84,44 86,48 50,62" fill="url(#amberGrad)"/>
    <!-- Winch Cable line -->
    <line x1="44" y1="46" x2="72" y2="36" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="72" cy="36" r="2.5" fill="#f8fafc"/>
    <!-- Wheels -->
    <circle cx="32" cy="68" r="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="32" cy="68" r="3" fill="#f8fafc"/>
    <circle cx="68" cy="68" r="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="68" cy="68" r="3" fill="#f8fafc"/>
    <!-- Emergency Flashing Light on cabin -->
    <polygon points="32,42 38,42 36,46 30,46" fill="#f59e0b"/>
  </g>

  <!-- Typography: Primary Arabic Brand Name -->
  <text x="128" y="60" font-family="'Cairo', system-ui, sans-serif" font-weight="900" font-size="42" fill="#0f172a" letter-spacing="-0.5">
    ونش <tspan fill="#d97706">راشد</tspan>
  </text>
  
  <!-- Sub-tagline -->
  <text x="130" y="88" font-family="'Cairo', system-ui, sans-serif" font-weight="600" font-size="14" fill="#475569" letter-spacing="0.5">
    لإنقاذ وسحب السيارات • خدمة 24 ساعة
  </text>
  
  <!-- English Badge Subtext -->
  <rect x="400" y="32" width="130" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="465" y="48" font-family="'Cairo', system-ui, sans-serif" font-weight="700" font-size="10.5" fill="#b45309" text-anchor="middle" letter-spacing="1.5">
    RASHED TOWING
  </text>
  
  <text x="465" y="74" font-family="'Cairo', system-ui, sans-serif" font-weight="700" font-size="12" fill="#16a34a" text-anchor="middle">
    ● 01273486236
  </text>
</svg>
